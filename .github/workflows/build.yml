# Builds and tests AMEN-FM1 on every push: the desktop tests and demo, the FM-1 plugin blobs (.fep) with JieLi's
# Linux toolchain, and the installer site (site/, tested against a fake FM-1). Pushes to the default branch publish
# the site on GitHub Pages. The .fep files, the demo and the desktop plugins are the run's artifacts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Desktop tests
        run: make test

      - name: Demo and desktop plugins
        run: make demo breaks plugins

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        run: |
          set -e
          mkdir -p "$HOME/.jieli"
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C "$HOME/.jieli"
          tc=$(ls -d "$HOME"/.jieli/jieli-linux-toolchains-* | sort | tail -1)
          ln -sfn "$tc" "$HOME/.jieli/toolchain"
          echo "toolchain: $(basename "$tc")"
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" --version | head -1

      - name: FM-1 plugins (.fep)
        run: |
          sh tools/build_fm1.sh
          ls -la build/fm1/*.fep

      - uses: actions/cache@v4
        id: sdk
        with:
          path: ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: ac79-sdk-AC79NN_SDK_V1.2.1_2023-12-13

      - name: JieLi AC79 SDK (three files go into the firmware package)
        run: |
          set -e
          sudo apt-get install -y -q libraqm0 libfribidi0 >/dev/null
          pip install -q Pillow fonttools
          t=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          if [ ! -f "$t/uboot.boot" ]; then
            for n in 1 2 3 4 5; do
              rm -rf "$HOME/fw-AC79_AIoT_SDK"
              git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone -q --depth 1 --filter=blob:none --sparse \
                --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
                "$HOME/fw-AC79_AIoT_SDK" && git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set cpu/wl82/tools && break
              echo "gitee: attempt $n failed"; sleep $((n * 15))
            done
          fi
          ls -la "$t/uboot.boot" "$t/cfg_tool.bin" "$t/cfg/eq_cfg_hw.bin"

      - name: AMEN firmware
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: sh tools/build_amen.sh 0.3

      - name: AMEN's screens (the 80s look, AMEN_SETUP=1) through Felucca's renderer and layout lint
        run: |
          pip install pillow >/dev/null 2>&1 || true
          sh tools/amen_ui_check.sh v0.3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amen-ui
          path: |
            build/amen-ui/sheet_AMEN.png
            build/amen-ui/AMEN/*.png
            build/amen-ui/report.txt

      - name: Felucca's host tests, AMEN against Felucca 1.9.0
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: sh tools/felucca_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: felucca-tests
          path: |
            build/tests/*.log
            build/tests/*.fails

      - uses: actions/upload-artifact@v4
        with:
          name: amen-firmware
          path: |
            build/amen/*.fwsc
            build/amen/*.bin
            build/amen/amen.json

      - name: AMEN OS on the desktop (the simulator's session and checks)
        run: make sim

      - name: AMEN OS for the FM-1 (built and kept as an artifact; NOT on the site until it runs on hardware)
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: sh tools/build_os.sh 0.3

      - uses: actions/upload-artifact@v4
        with:
          name: amen-os-experimental
          path: |
            build/os/*.fwsc
            build/os/amen-os.json
            build/sim/*.ppm

      - name: Installer site
        run: sh tools/build_site.sh

      - name: Installer site against a fake FM-1
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/site/e2e.js build/site

      - uses: actions/upload-artifact@v4
        with:
          name: amen-fm1-fep
          path: build/fm1/*.fep

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amen-fm1-demo
          path: |
            build/demo.wav
            build/break*.wav
            build/plugins/*.so

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: build/site

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
